<!doctype html>
<!-- Base CV design. Fill {{...}} and repeat blocks. For Hebrew set lang="he" dir="rtl" and flip the gradient to 270deg. -->
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>{{NAME}}, {{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#18181B;--mut:#71717A;--line:#E4E4E7;--muted:#F4F4F5;--accent:#4C2A92;--gold:#FBBF24}
body{width:210mm;font-family:Heebo,sans-serif;color:var(--ink);font-size:9.6pt;line-height:1.43;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:tabular-nums}
.page{width:210mm;height:297mm;overflow:hidden}
.top{background:linear-gradient(90deg,#3B1E6E,#5B3FB0);color:#fff;padding:30px 48px 24px}
h1{font-size:27pt;font-weight:800;line-height:1.05}.t{font-size:12pt;font-weight:500;color:var(--gold);margin-top:4px}
.c{font-size:9pt;color:rgba(255,255,255,.85);margin-top:8px;display:flex;gap:18px}
.w{padding:0 48px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 13px 9px;box-shadow:0 1px 2px rgba(24,24,27,.05)}
.card span{display:block;font-size:8.4pt;font-weight:500;color:var(--mut)}.card b{display:block;font-size:17pt;font-weight:700;direction:ltr}
h2{font-size:10.5pt;font-weight:700;margin:15px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;border-radius:6px;font-size:8.2pt;font-weight:500;padding:2px 8px}
.b-sec{background:var(--muted)}.b-out{border:1px solid var(--line);color:var(--mut)}.b-p{background:#EFEAFB;color:var(--accent)}
.rec{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.job+.job{margin-top:9px}.jh{display:flex;justify-content:space-between;align-items:center}
.org{font-size:11pt;font-weight:700}.role{font-size:9.1pt;color:var(--mut);margin:1px 0 3px}
ul{padding-inline-start:15px}li{margin:2.3px 0}li::marker{color:#A1A1AA}
.bottom{display:grid;grid-template-columns:1.3fr 1fr;gap:0 28px}.grp{margin-bottom:6px}.lbl{font-size:8.6pt;font-weight:500;color:var(--mut);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.small{font-size:9.1pt}.mut{color:var(--mut)}
</style></head><body><div class="page">
<div class="top"><h1>{{NAME}}</h1><div class="t">{{TITLE}}</div><div class="c"><span>{{CITY}}</span><span dir="ltr">{{PHONE}}</span><span dir="ltr">{{EMAIL}}</span><span dir="ltr">{{LINKEDIN}}</span></div></div>
<div class="w">
<div class="stats"><div class="card"><span>{{METRIC_LABEL}}</span><b>{{METRIC}}</b></div><!-- x3-4 --></div>
<h2>Profile</h2><p>{{SUMMARY}}</p><div class="rec"><span class="badge b-p">★ {{AWARD}}</span></div>
<h2>Experience</h2>
<div class="job"><div class="jh"><span class="org">{{COMPANY}}</span><span class="badge b-out" dir="ltr">{{YEARS}}</span></div><p class="role">{{ROLE}}</p><ul><li>{{BULLET}}</li></ul></div>
<div class="bottom"><div><h2>Skills</h2><div class="grp"><div class="lbl">{{GROUP}}</div><div class="chips"><span class="badge b-sec">{{SKILL}}</span></div></div></div>
<div class="small"><h2>Education</h2><p>{{DEGREE}}<br><span class="mut">{{SCHOOL}}</span></p><h2>Military</h2><p>{{SERVICE}}</p><h2>Languages</h2><p>{{LANGUAGES}}</p></div></div>
</div></div></body></html>
